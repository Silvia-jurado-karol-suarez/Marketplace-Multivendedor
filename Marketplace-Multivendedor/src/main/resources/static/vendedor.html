<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel del Vendedor</title>

    <link rel="stylesheet" href="/css/estilos.css">

</head>

<body>

<header>

    <div class="logo">
        Marketplace
    </div>

    <nav>

        <a href="/marketplace.html">
            Inicio
        </a>

        <a href="/vendedor.html">
            Mis productos
        </a>

        <a href="/login.html">
            Cerrar sesión
        </a>

    </nav>

</header>


<main class="contenedor">

    <section class="panel">

        <h1>
            Panel del vendedor
        </h1>

        <p>
            Administra los productos que ofreces
            en el Marketplace.
        </p>

    </section>


    <!-- CREAR PRODUCTO -->

    <section class="panel">

        <h2>
            Crear producto
        </h2>

        <form id="formProducto">

            <label>
                Nombre del producto
            </label>

            <input
                type="text"
                id="nombre"
                placeholder="Ej: Laptop empresarial"
                required
            >


            <label>
                Descripción
            </label>

            <textarea
                id="descripcion"
                placeholder="Descripción del producto"
                required
            ></textarea>


            <label>
                Precio
            </label>

            <input
                type="number"
                id="precio"
                min="0"
                required
            >


            <label>
                Stock
            </label>

            <input
                type="number"
                id="stock"
                min="0"
                required
            >


            <label>
                Categoría
            </label>

            <select id="categoria" required>

                <option value="">
                    Seleccione una categoría
                </option>

                <option value="Tecnología">
                    Tecnología
                </option>

                <option value="Hogar">
                    Hogar
                </option>

                <option value="Ropa">
                    Ropa
                </option>

                <option value="Accesorios">
                    Accesorios
                </option>

            </select>


            <button type="submit">
                Crear producto
            </button>

        </form>


        <div id="mensajeProducto"></div>

    </section>


    <!-- MIS PRODUCTOS -->

    <section class="panel">

        <div class="titulo-seccion">

            <h2>
                Mis productos
            </h2>

            <button onclick="cargarProductos()">
                Actualizar
            </button>

        </div>


        <div id="listaProductos">

            <p>
                Cargando productos...
            </p>

        </div>

    </section>


</main>


<script src="/js/vendedor.js"></script>

</body>

</html>
