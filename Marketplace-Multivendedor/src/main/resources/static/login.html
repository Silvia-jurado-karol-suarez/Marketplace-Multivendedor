<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>


<body>

<header>

    <div class="logo">
        Marketplace
    </div>

    <nav>

        <a href="index.html">
            Inicio
        </a>

        <a href="registro.html">
            Registrarse
        </a>

    </nav>

</header>


<main>

<section class="inicio">

    <h1>
        Iniciar sesión
    </h1>


    <form id="formLogin">

        <input
            type="email"
            id="correo"
            placeholder="Correo electrónico"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <br><br>

        <button type="submit" class="btn">
            Iniciar sesión
        </button>

    </form>


    <p id="mensaje"></p>

</section>

</main>


<script src="js/login.js"></script>

</body>

</html>
