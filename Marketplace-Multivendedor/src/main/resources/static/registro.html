<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Registro - Marketplace</title>

    <link rel="stylesheet"
          href="css/estilos.css">

</head>


<body>

<header>

    <div class="logo">
        Marketplace
    </div>

    <nav>

        <a href="index.html">
            Inicio
        </a>

        <a href="login.html">
            Iniciar sesión
        </a>

    </nav>

</header>


<main>

<section class="inicio">

    <h1>
        Crear cuenta
    </h1>

    <form id="formRegistro">

        <input
            type="text"
            id="nombre"
            placeholder="Nombre"
            required
        >

        <br><br>

        <input
            type="email"
            id="correo"
            placeholder="Correo electrónico"
            required
        >

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Contraseña"
            required
        >

        <br><br>

        <button type="submit" class="btn">
            Registrarse
        </button>

    </form>

    <p id="mensaje"></p>

</section>

</main>


<script src="js/registro.js"></script>

</body>

</html>
